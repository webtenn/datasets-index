name: Sync Datasets Index

on:
  # Run once a day at 2:00 AM UTC
  schedule:
    - cron: "0 2 * * *"

  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run sync script
        env:
          WEBFLOW_API_TOKEN: ${{ secrets.WEBFLOW_API_TOKEN }}
          WEBFLOW_SITE_ID: ${{ secrets.WEBFLOW_SITE_ID }}
        run: node sync-datasets-index.js

      - name: Upload index via GitHub API
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
        run: |
          # Get current file SHA (needed for updates)
          export SHA=$(curl -s -H "Authorization: Bearer $GH_PAT" "https://api.github.com/repos/$GH_OWNER/$GH_REPO/contents/datasets-index.json" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('sha',''))" 2>/dev/null || echo "")

          # Build the JSON payload in a file -- passing base64 content as a
          # curl -d argument blows past the OS argv length limit once the
          # file is a few hundred items, so write it and use --data-binary @file instead.
          export TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          python3 -c "
import base64, json, os, sys

with open('datasets-index.json', 'rb') as f:
    content = base64.b64encode(f.read()).decode()

payload = {
    'message': f'chore: update datasets index [{os.environ[\"TIMESTAMP\"]}]',
    'content': content,
}
sha = os.environ.get('SHA', '')
if sha:
    payload['sha'] = sha

with open('payload.json', 'w') as f:
    json.dump(payload, f)
"

          # Push the file via API
          curl -s -X PUT -H "Authorization: Bearer $GH_PAT" -H "Content-Type: application/json" --data-binary @payload.json "https://api.github.com/repos/$GH_OWNER/$GH_REPO/contents/datasets-index.json"

          echo "Done updating datasets-index.json"
