name: Sync Datasets Index

on:
  # Run once a day at 2:00 AM UTC
  schedule:
    - cron: "0 2 * * *"

  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run sync script
        env:
          WEBFLOW_API_TOKEN: ${{ secrets.WEBFLOW_API_TOKEN }}
          WEBFLOW_SITE_ID: ${{ secrets.WEBFLOW_SITE_ID }}
        run: node sync-datasets-index.js

      - name: Upload index via GitHub API
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
        run: |
          # Base64 encode the file
          CONTENT=$(base64 -w 0 datasets-index.json)

          # Get current file SHA (needed for updates)
          SHA=$(curl -s -H "Authorization: Bearer $GH_PAT" "https://api.github.com/repos/$GH_OWNER/$GH_REPO/contents/datasets-index.json" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('sha',''))" 2>/dev/null || echo "")

          # Build the JSON payload
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          if [ -z "$SHA" ]; then
            PAYLOAD="{\"message\":\"chore: update datasets index [$TIMESTAMP]\",\"content\":\"$CONTENT\"}"
          else
            PAYLOAD="{\"message\":\"chore: update datasets index [$TIMESTAMP]\",\"content\":\"$CONTENT\",\"sha\":\"$SHA\"}"
          fi

          # Push the file via API
          curl -s -X PUT -H "Authorization: Bearer $GH_PAT" -H "Content-Type: application/json" -d "$PAYLOAD" "https://api.github.com/repos/$GH_OWNER/$GH_REPO/contents/datasets-index.json"

          echo "Done updating datasets-index.json"
